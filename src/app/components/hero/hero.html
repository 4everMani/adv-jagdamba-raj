<section id="home" class="hero-carousel">
  <div class="carousel-inner">
    <div class="carousel-item" *ngFor="let slide of slides; let i = index" [class.active]="i === currentSlide" [style.backgroundImage]="'linear-gradient(rgba(0, 31, 63, 0.85), rgba(0, 31, 63, 0.85)), url(' + slide.image + ')'">
      <div class="container hero-container">
        <div class="hero-content">
          <h4 class="welcome-text">{{slide.welcome}}</h4>
          <h1>{{slide.title}}</h1>
          <p>{{slide.desc}}</p>
          <div class="hero-actions">
            <a href="#contact" class="btn btn-gold">Free Consultation</a>
            <a href="#expertise" class="btn btn-white">Our Expertise</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Indicators -->
  <div class="carousel-indicators">
    <span *ngFor="let slide of slides; let i = index" [class.active]="i === currentSlide" (click)="goToSlide(i)"></span>
  </div>

  <!-- Controls -->
  <button class="carousel-control prev" (click)="prevSlide()">
    <i class="fas fa-chevron-left"></i>
  </button>
  <button class="carousel-control next" (click)="nextSlide()">
    <i class="fas fa-chevron-right"></i>
  </button>
</section>
